<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Student Attendance Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Attendance Management System</h1>
        <p>Student Management</p>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="attendance.html">Attendance</a>
        <a href="reports.html">Reports</a>
    </nav>

    <main>

        <section class="page-header">
            <h2>Student Management</h2>
            <p>View and manage student information.</p>
        </section>

        <section class="student-actions">

            <div class="form-group">
                <label for="searchStudent">Search Students</label>

                <input
                    type="text"
                    id="searchStudent"
                    placeholder="Search by name or roll number..."
                >
            </div>

            <div class="form-group">
                <label for="newRoll">Roll No.</label>
                <input type="text" id="newRoll" placeholder="e.g. 104">
            </div>

            <div class="form-group">
                <label for="newName">Student Name</label>
                <input type="text" id="newName" placeholder="Full name">
            </div>

            <div class="form-group">
                <label for="newCourse">Course</label>
                <input type="text" id="newCourse" placeholder="e.g. B.Tech">
            </div>

            <div class="form-group">
                <label for="newEmail">Email</label>
                <input type="text" id="newEmail" placeholder="name@example.com">
            </div>

            <button id="addStudentButton" type="button">
                + Add Student
            </button>

        </section>

        <section class="table-section">

            <h2>Student List</h2>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Roll No.</th>
                            <th>Student Name</th>
                            <th>Course</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody"></tbody>
                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Student Attendance Management System</p>
    </footer>

    <script src="students.js"></script>
</body>
</html>
